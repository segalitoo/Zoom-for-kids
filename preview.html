<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoom for Kids — UI Preview</title>
    <style>
      /* ── Page scaffold ── */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #1a1a3e;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 48px;
        flex-wrap: wrap;
        padding: 40px 24px;
      }

      /* Fake Zoom meeting background */
      .zoom-bg {
        position: relative;
        width: 760px;
        height: 480px;
        background: #1c1c1c;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        flex-shrink: 0;
      }

      /* Fake video tiles */
      .video-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        width: 100%;
        height: 100%;
        padding: 4px;
      }

      .video-tile {
        background: #2a2a2a;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: rgba(255,255,255,0.4);
        font-size: 0.8rem;
        position: relative;
      }

      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      .tile-name {
        font-size: 0.75rem;
        font-weight: 600;
        color: rgba(255,255,255,0.5);
      }

      /* ── THE PANEL ── */
      .panel {
        position: absolute;
        bottom: 20px;
        right: 20px;
        width: 290px;
        padding: 16px;
        background: rgba(15, 15, 35, 0.93);
        backdrop-filter: blur(16px);
        border-radius: 24px;
        border: 1.5px solid rgba(255,255,255,0.12);
        box-shadow:
          0 8px 32px rgba(0,0,0,0.45),
          0 0 0 1px rgba(255,255,255,0.04) inset;
        display: flex;
        flex-direction: column;
        gap: 14px;
        color: #fff;
        animation: slideIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }

      /* Header */
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .panel-title {
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .minimize-btn {
        width: 28px; height: 28px;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        border: none;
        color: rgba(255,255,255,0.7);
        font-size: 0.75rem;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .minimize-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

      /* Section label */
      .section-label {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(255,255,255,0.45);
        margin-bottom: 8px;
      }

      /* Emoji grid */
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .emoji-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        aspect-ratio: 1;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease;
        box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      }
      .emoji-btn:hover  { transform: scale(1.12); }
      .emoji-btn:active { transform: scale(0.90); }

      .emoji-icon  { font-size: 1.65rem; line-height: 1; }
      .emoji-label {
        font-size: 0.58rem;
        font-weight: 800;
        color: rgba(255,255,255,0.9);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      /* Control buttons (hand raise + mute) */
      .ctrl-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 62px;
        padding: 0 18px;
        border-radius: 18px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 800;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }
      .ctrl-btn:hover  { transform: scale(1.02); }
      .ctrl-btn:active { transform: scale(0.97); }

      /* Hand raise states */
      .hand-lowered {
        background: rgba(100,116,139,0.45);
        color: rgba(255,255,255,0.8);
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .hand-raised {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1a1a1a;
        box-shadow: 0 4px 22px rgba(251,191,36,0.55);
        animation: pulseGlow 2s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%,100% { box-shadow: 0 4px 16px rgba(251,191,36,0.4); }
        50%      { box-shadow: 0 4px 32px rgba(251,191,36,0.75); }
      }

      /* Mute states */
      .unmuted {
        background: linear-gradient(135deg, #34d399, #10b981);
        color: #052e16;
        box-shadow: 0 4px 18px rgba(52,211,153,0.45);
      }
      .muted {
        background: linear-gradient(135deg, #f87171, #ef4444);
        color: #fff;
        box-shadow: 0 4px 18px rgba(239,68,68,0.45);
      }

      .ctrl-icon  { font-size: 1.65rem; line-height: 1; flex-shrink: 0; }
      .ctrl-text  {
        display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      }
      .ctrl-status { font-size: 1.05rem; font-weight: 800; line-height: 1; }
      .ctrl-hint   {
        font-size: 0.62rem; font-weight: 600; opacity: 0.65;
        text-transform: lowercase; letter-spacing: 0.02em;
      }

      /* ── Minimized rocket ── */
      .rocket-btn {
        position: absolute;
        bottom: 20px; right: 20px;
        width: 56px; height: 56px;
        border-radius: 50%;
        background: rgba(15,15,35,0.93);
        backdrop-filter: blur(16px);
        border: 1.5px solid rgba(255,255,255,0.15);
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        font-size: 1.6rem;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
        animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
      }
      .rocket-btn:hover { transform: scale(1.15); }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.4); }
        to   { opacity: 1; transform: scale(1);   }
      }

      /* ── Side-by-side state cards ── */
      .states-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .state-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .state-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: rgba(255,255,255,0.45);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* ── Popup preview ── */
      .popup-preview {
        width: 240px;
        background: #0f0f23;
        border-radius: 14px;
        padding: 20px 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .popup-header {
        display: flex; align-items: center; gap: 8px;
      }
      .popup-icon { font-size: 1.5rem; }
      .popup-title { font-size: 1.05rem; font-weight: 800; color: #fff; }
      .popup-desc {
        font-size: 0.8rem; color: rgba(255,255,255,0.65); line-height: 1.45;
      }
      .popup-tip {
        font-size: 0.75rem; color: rgba(255,255,255,0.45);
        background: rgba(255,255,255,0.06);
        border-radius: 10px; padding: 8px 12px; line-height: 1.4;
      }
      .popup-footer {
        font-size: 1.3rem; text-align: center; padding-top: 4px;
        letter-spacing: 0.1em;
      }

      /* ── Page title ── */
      .page-title {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        font-size: 0.8rem; font-weight: 700;
        color: rgba(255,255,255,0.3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        pointer-events: none;
      }

      /* Toggle demo button */
      .demo-toggle {
        position: fixed;
        bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: rgba(255,255,255,0.7);
        padding: 8px 20px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: background 0.15s;
      }
      .demo-toggle:hover { background: rgba(255,255,255,0.18); }
    </style>
  </head>
  <body>

    <p class="page-title">Zoom for Kids — UI Preview</p>

    <!-- ══════════════════════════════════════════════
         MAIN: Fake Zoom meeting with panel injected
    ══════════════════════════════════════════════ -->
    <div class="zoom-bg" id="zoom-bg">

      <!-- Fake video tiles -->
      <div class="video-grid">
        <div class="video-tile">
          <div class="avatar" style="background:#1e3a5f">👩‍🏫</div>
          <span class="tile-name">Ms. Johnson (Teacher)</span>
        </div>
        <div class="video-tile">
          <div class="avatar" style="background:#1a3320">🧒</div>
          <span class="tile-name">Emma</span>
        </div>
        <div class="video-tile">
          <div class="avatar" style="background:#3d1a1a">👦</div>
          <span class="tile-name">Luca</span>
        </div>
        <div class="video-tile">
          <div class="avatar" style="background:#1a1a3d">🧒</div>
          <span class="tile-name">Sofia</span>
        </div>
      </div>

      <!-- THE INJECTED PANEL -->
      <div class="panel" id="main-panel">

        <!-- Header -->
        <div class="panel-header">
          <span class="panel-title">🌟 Zoom for Kids</span>
          <button class="minimize-btn" onclick="minimizePanel()" title="Minimize">✕</button>
        </div>

        <!-- Emoji Reactions -->
        <section>
          <p class="section-label">React! 🎭</p>
          <div class="emoji-grid">
            <button class="emoji-btn" style="background:#f59e0b"
              onclick="popBtn(this)" title="Clap">
              <span class="emoji-icon">👏</span>
              <span class="emoji-label">Clap</span>
            </button>
            <button class="emoji-btn" style="background:#22c55e"
              onclick="popBtn(this)" title="Good">
              <span class="emoji-icon">👍</span>
              <span class="emoji-label">Good</span>
            </button>
            <button class="emoji-btn" style="background:#ef4444"
              onclick="popBtn(this)" title="Love">
              <span class="emoji-icon">❤️</span>
              <span class="emoji-label">Love</span>
            </button>
            <button class="emoji-btn" style="background:#f97316"
              onclick="popBtn(this)" title="Funny">
              <span class="emoji-icon">😂</span>
              <span class="emoji-label">Funny</span>
            </button>
            <button class="emoji-btn" style="background:#8b5cf6"
              onclick="popBtn(this)" title="Party">
              <span class="emoji-icon">🎉</span>
              <span class="emoji-label">Party</span>
            </button>
            <button class="emoji-btn" style="background:#06b6d4"
              onclick="popBtn(this)" title="Wow">
              <span class="emoji-icon">😮</span>
              <span class="emoji-label">Wow</span>
            </button>
          </div>
        </section>

        <!-- Hand Raise -->
        <button class="ctrl-btn hand-lowered" id="hand-btn" onclick="toggleHand()">
          <span class="ctrl-icon">✋</span>
          <span class="ctrl-text">
            <span class="ctrl-status" id="hand-status">Raise Hand</span>
            <span class="ctrl-hint" id="hand-hint">tap to raise</span>
          </span>
        </button>

        <!-- Mute Toggle -->
        <button class="ctrl-btn unmuted" id="mute-btn" onclick="toggleMute()">
          <span class="ctrl-icon" id="mute-icon">🎤</span>
          <span class="ctrl-text">
            <span class="ctrl-status" id="mute-status">I can talk</span>
            <span class="ctrl-hint" id="mute-hint">tap to mute</span>
          </span>
        </button>

      </div>

      <!-- Minimized rocket (hidden by default) -->
      <button class="rocket-btn" id="rocket-btn" style="display:none"
        onclick="expandPanel()" title="Open Zoom for Kids">🚀</button>

    </div>

    <!-- ══════════════════════════════════════════════
         SIDE: Popup + state variants
    ══════════════════════════════════════════════ -->
    <div style="display:flex;flex-direction:column;gap:24px;align-items:center">

      <!-- Popup -->
      <div>
        <p class="state-label" style="text-align:center;margin-bottom:8px">Extension Popup</p>
        <div class="popup-preview">
          <div class="popup-header">
            <span class="popup-icon">🌟</span>
            <h1 class="popup-title">Zoom for Kids</h1>
          </div>
          <p class="popup-desc">Big, easy buttons for Zoom — made for kids!</p>
          <p class="popup-tip">Join a Zoom meeting to see your kid-friendly controls.</p>
          <div class="popup-footer">👏 👍 ❤️ ✋ 🎤</div>
        </div>
      </div>

      <!-- Button state showcase -->
      <div>
        <p class="state-label" style="text-align:center;margin-bottom:8px">Button States</p>
        <div style="display:flex;flex-direction:column;gap:10px;width:200px">
          <button class="ctrl-btn hand-raised" style="pointer-events:none">
            <span class="ctrl-icon">✋</span>
            <span class="ctrl-text">
              <span class="ctrl-status">Hand Up!</span>
              <span class="ctrl-hint">tap to lower</span>
            </span>
          </button>
          <button class="ctrl-btn hand-lowered" style="pointer-events:none">
            <span class="ctrl-icon">✋</span>
            <span class="ctrl-text">
              <span class="ctrl-status">Raise Hand</span>
              <span class="ctrl-hint">tap to raise</span>
            </span>
          </button>
          <button class="ctrl-btn unmuted" style="pointer-events:none">
            <span class="ctrl-icon">🎤</span>
            <span class="ctrl-text">
              <span class="ctrl-status">I can talk</span>
              <span class="ctrl-hint">tap to mute</span>
            </span>
          </button>
          <button class="ctrl-btn muted" style="pointer-events:none">
            <span class="ctrl-icon">🔇</span>
            <span class="ctrl-text">
              <span class="ctrl-status">I'm quiet</span>
              <span class="ctrl-hint">tap to speak</span>
            </span>
          </button>
        </div>
      </div>

    </div>

    <button class="demo-toggle" onclick="toggleMute()">Toggle Mute</button>

    <script>
      let handRaised = false;
      let isMuted = false;

      function popBtn(btn) {
        btn.style.transform = 'scale(0.82)';
        setTimeout(() => { btn.style.transform = 'scale(1.18)'; }, 80);
        setTimeout(() => { btn.style.transform = ''; }, 280);

        // Show floating emoji burst
        const burst = document.createElement('div');
        burst.textContent = btn.querySelector('.emoji-icon').textContent;
        burst.style.cssText = `
          position:fixed;
          left:${event.clientX - 20}px;
          top:${event.clientY - 20}px;
          font-size:2.5rem;
          pointer-events:none;
          animation:burstUp 0.7s ease-out forwards;
          z-index:99999;
        `;
        document.body.appendChild(burst);
        setTimeout(() => burst.remove(), 700);
      }

      function toggleHand() {
        handRaised = !handRaised;
        const btn = document.getElementById('hand-btn');
        const status = document.getElementById('hand-status');
        const hint = document.getElementById('hand-hint');

        if (handRaised) {
          btn.className = 'ctrl-btn hand-raised';
          status.textContent = 'Hand Up!';
          hint.textContent = 'tap to lower';
          // Wave animation
          btn.style.animation = 'handWave 0.5s ease-in-out';
          setTimeout(() => { btn.style.animation = ''; }, 500);
        } else {
          btn.className = 'ctrl-btn hand-lowered';
          status.textContent = 'Raise Hand';
          hint.textContent = 'tap to raise';
        }
      }

      function toggleMute() {
        isMuted = !isMuted;
        const btn = document.getElementById('mute-btn');
        const icon = document.getElementById('mute-icon');
        const status = document.getElementById('mute-status');
        const hint = document.getElementById('mute-hint');

        if (isMuted) {
          btn.className = 'ctrl-btn muted';
          icon.textContent = '🔇';
          status.textContent = "I'm quiet";
          hint.textContent = 'tap to speak';
        } else {
          btn.className = 'ctrl-btn unmuted';
          icon.textContent = '🎤';
          status.textContent = 'I can talk';
          hint.textContent = 'tap to mute';
        }

        btn.style.transform = 'scale(0.93)';
        setTimeout(() => { btn.style.transform = 'scale(1.04)'; }, 100);
        setTimeout(() => { btn.style.transform = ''; }, 250);
      }

      function minimizePanel() {
        document.getElementById('main-panel').style.display = 'none';
        document.getElementById('rocket-btn').style.display = 'flex';
      }

      function expandPanel() {
        document.getElementById('main-panel').style.display = 'flex';
        document.getElementById('rocket-btn').style.display = 'none';
      }
    </script>

    <style>
      @keyframes burstUp {
        0%   { opacity: 1; transform: scale(0.5) translateY(0);    }
        60%  { opacity: 1; transform: scale(1.3) translateY(-40px); }
        100% { opacity: 0; transform: scale(1)   translateY(-80px); }
      }
      @keyframes handWave {
        0%   { transform: scale(1)    rotate(0deg); }
        25%  { transform: scale(1.05) rotate(-10deg); }
        50%  { transform: scale(1.05) rotate(10deg);  }
        75%  { transform: scale(1.05) rotate(-5deg);  }
        100% { transform: scale(1)    rotate(0deg); }
      }
    </style>
  </body>
</html>
